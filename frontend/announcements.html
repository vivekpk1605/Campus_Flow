<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusFlow | Announcements</title>
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <aside class="sidebar">
      <h2>CampusFlow</h2>
      <nav>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="announcements.html">Announcements</a>
        <a href="rooms.html">Rooms</a>
        <a href="complaints.html">Complaints</a>
        <a href="lost-found.html">Lost &amp; Found</a>
      </nav>
      <button class="btn secondary" onclick="logout()">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar"><h1>Announcements</h1></header>
      <section class="panel role-form" data-roles="ADMIN">
        <h2>Publish announcement</h2>
        <form id="announcementForm" class="data-form">
          <input id="announcementTitle" placeholder="Announcement title" required />
          <textarea id="announcementDescription" rows="3" placeholder="Announcement details" required></textarea>
          <input id="announcementCategory" placeholder="Category" required />
          <button class="btn primary" type="submit">Publish announcement</button>
        </form>
        <div id="announcementMessage" class="message"></div>
      </section>
      <section class="panel">
        <div id="announcementsList"></div>
      </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/announcements.js"></script>
  </body>
</html>
